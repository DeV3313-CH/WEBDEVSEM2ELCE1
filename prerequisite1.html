<!DOCTYPE html>
<html>
<head>
    <title>Hill Climb Racing</title>
</head>
<body>
    <h1>Hill Climb Racing</h1>
    <p>Drive your car through hills and collect coins!</p> 
    <div class="game-image">
        <img src="https://store-images.microsoft.com/image/apps.18483.9007199266379485.0000ad5a-1400-4539-b79a-62b2b9248545.0ac4e475-8d4b-42bb-8723-14576cb8e50a?h=1280" alt="Hill Climb Racing">
    </div>
    <div class="buttons">
        <button>Start Game</button>
        <button>Options</button>
        <button>High Score</button>
        <button>Exit</button>
    </div>
    <div class="footer">
        <p>Created by DEV CHAUHAN | 2026</p>
    </div>
        <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(skyblue, lightgreen);
        }

        h1 {
            margin-top: 50px;
            font-size: 50px;
            color: darkred;
        }

        p {
            font-size: 20px;
            color: black;
        }

        .game-image {
            margin-top: 30px;
        }

        .game-image img {
            width: 500px;
            border-radius: 15px;
        }

        .buttons {
            margin-top: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            background-color: orange;
            color: white;
        }

        button:hover {
            background-color: red;
        }

        .footer {
            margin-top: 100px;
            font-size: 14px;
            color: rgba(7, 236, 76, 0.722);
        }
    </style>
</body>
</html>
