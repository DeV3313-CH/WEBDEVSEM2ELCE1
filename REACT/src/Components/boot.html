<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstarp example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">"

</head>
<body>
    <h1 class="text-primary text-center">hello bootstrap</h1>
    <div class="container bg-dark text-white p-3">fixed width number</div>
    <div class="container-fluid bg-warning p-3">full width container</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div class="container">
   
    <div class="row">
            <div class="col-4 bg-primary p-3">column 1</div>
            <div class="col-4 bg-secondary p-3">column 2</div>
            <div class="col-4 bg-success p-3">column 3</div>  

    </div>
    <div class="col-4 bg-primary p-3">4 columns</div>
    <div class="col-4 bg-warning p-3">8 columns</div>
</body>
</html>
