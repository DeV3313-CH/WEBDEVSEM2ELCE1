<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Management System</title>
     <link rel="stylesheet" href="main.css">
</head>
<body>
        <div class="container">
            
        <h2>Employee Salary Management System</h2>
        <table width="50%" border="0" align="center" cellpadding="5" cellspacing="2">
            <tr>
                <td><label for="">Employee Name</label></td>
                <td>: </td>
                <td> <input type="text" id="name" placeholder="Employee Name"></td>
            </tr>

             <tr>
                <td><label for="">Employee Id</label></td>
                <td>: </td>
                <td> <input type="text" id="empId" placeholder="Employee Id"></td>
            </tr>

             <tr>
                <td><label for="">Employee Salary</label></td>
                <td>: </td>
                <td> <input type="number" id="salary" placeholder="Employee Salary"></td>
            </tr>

             <tr>
                <td><label for="">Employee Department</label></td>
                <td>: </td>
                <td> <input type="text" id="dept" placeholder="Employee Department"></td>
            </tr>

            <tr>
                <td><button onclick="addEmployee()">Add Employee</button></td>
                <td><button onclick="displayEmployees()">Display All</button></td>
                <td><button onclick="filterSalary()">Salary > 50000</button></td>
            </tr>

            <tr>
                <td><button onclick="totalSalary()">Total Salary</button></td>
                <td><button onclick="averageSalary()">Average Salary</button></td>
                <td><button onclick="countDepartment()">Count by Department</button></td>
            </tr>
        </table>
       
        <div id="output"></div>
    </div>
    <style>body {
    font-family: Arial;
    background-color: #eef2f3;
    text-align: center;
}
.container {
    width: 650px;
    margin: 40px auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}
input {
    padding: 8px;
    margin: 5px;
}
button {
    padding: 8px 12px;
    margin: 5px;
    background-color: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: #1e7e34;
}
#output {
    margin-top: 20px;
    text-align: left;
}</style>
<script
let heading = document.getElementById("mainHeading");
let paragraph = document.getElementById("paragraph");
let input = document.getElementById("userInput");

let fontSize = 16;

// Change heading text (onclick using addEventListener)
document.getElementById("changeTextBtn").addEventListener("click", function () {
    if (input.value !== "") {
        heading.innerHTML = input.value;
    }
});

// Change background color
document.getElementById("bgColorBtn").onclick = function () {
    document.body.style.backgroundColor =
        "#" + Math.floor(Math.random() * 16777215).toString(16);
};

// Increase font size
document.getElementById("fontSizeBtn").addEventListener("click", function () {
    fontSize += 2;
    paragraph.style.fontSize = fontSize + "px";
});

// Show/Hide paragraph
document.getElementById("toggleBtn").addEventListener("click", function () {
    if (paragraph.style.display === "none") {
        paragraph.style.display = "block";
    } else {
        paragraph.style.display = "none";
    }
});

// Reset page
document.getElementById("resetBtn").addEventListener("click", function () {
    heading.innerHTML = "Welcome to JavaScript Lab";
    paragraph.style.display = "block";
    paragraph.style.fontSize = "16px";
    document.body.style.backgroundColor = "#f4f4f4";
    input.value = "";
    fontSize = 16;
});
}></script>

</html>
